<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
        }

        .left {
            width: 50%;
            background: url("{{ url_for('static', filename='ashford_special_school.jpg') }}") no-repeat center;
            background-size: cover;
        }

        .right {
            width: 50%;
            background: linear-gradient(135deg, #c62828, #e53935);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 90px;
        }

        .box {
            background: white;
            padding: 45px 35px;
            border-radius: 12px;
            text-align: center;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 25px;
            color: #333;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        button:hover {
            background: #a61c1c;
        }

        a {
            text-decoration: none;
        }

        /* ✅ NEW LABEL STYLE */
        .footer-label {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #660000;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        @media (max-width: 768px) {
            .left {
                display: none;
            }

            .right {
                width: 100%;
            }
        }
    </style>

    <!-- AUTO REDIRECT SCRIPT -->
    <script>
        let timeout;

        function resetTimer() {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                window.location.href = "/";
            }, 30000); // 30 seconds
        }

        // Reset timer on any interaction
        window.onload = resetTimer;
        document.onmousemove = resetTimer;
        document.onkeypress = resetTimer;
        document.ontouchstart = resetTimer;
        document.onclick = resetTimer;
    </script>

</head>

<body>

<div class="left"></div>

<div class="right">

    <img src="{{ url_for('static', filename='logo.png') }}" class="logo">

    <div class="box">
        <h1>Welcome</h1>

        <a href="/get-started">
            <button>Get Started</button>
        </a>

        <a href="/signout">
            <button>Sign Out</button>
        </a>

    </div>

</div>

<!-- ✅ NEW LABEL -->
<div class="footer-label">
    This application has been developed by the author. All rights are reserved.

</div>

</body>
</html>
