<!DOCTYPE html>
<html>
<head>
    <title>Thank You</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
        }

        .left {
            width: 50%;
            background: url("{{ url_for('static', filename='Outsideimages.jpg') }}") no-repeat center;
            background-size: cover;
        }

        .right {
            width: 50%;
            background: linear-gradient(135deg, #c62828, #e53935);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 90px;
        }

        .box {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            text-align: center;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin: 5px 0;
        }

        .timer {
            font-size: 13px;
            color: #999;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        button:hover {
            background: #a61c1c;
        }

        a {
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .left {
                display: none;
            }

            .right {
                width: 100%;
            }
        }
    </style>

    <!-- AUTO REDIRECT SCRIPT -->
    <script>
        let timeout;

        function resetTimer() {
            clearTimeout(timeout);
            timeout = setTimeout(function () {
                window.location.href = "/";
            }, 30000); // 30 seconds
        }

        window.addEventListener("load", resetTimer);
        document.addEventListener("mousemove", resetTimer);
        document.addEventListener("keypress", resetTimer);
        document.addEventListener("click", resetTimer);
        document.addEventListener("touchstart", resetTimer);
    </script>

</head>

<body>

<div class="left"></div>

<div class="right">

    <img src="{{ url_for('static', filename='logo.png') }}" class="logo">

    <div class="box">
        <h2>Thank You</h2>
        <p>Please go to Next Visistor </p>
        <p class="timer">or Return to Home Page...</p>

        <a href="/returning">
        <button class="btn-maroon">➡ Next Visitor</button>
    </a>

	<a href="/">
            <button>⬅ Back to Home</button>
        </a>
    </div>

</div>
<!-- AUTO REDIRECT SCRIPT (FIXED & RELIABLE) -->
<script>
    let timeout;

    function resetTimer() {
        clearTimeout(timeout);
        timeout = setTimeout(function () {
            window.location.href = "/";
        }, 30000); // 30 seconds
    }

    function setupActivityTracking() {
        window.addEventListener("load", resetTimer);
        document.addEventListener("mousemove", resetTimer);
        document.addEventListener("keypress", resetTimer);
        document.addEventListener("click", resetTimer);
        document.addEventListener("touchstart", resetTimer);
    }

    setupActivityTracking();
</script>
</body>
</html>
