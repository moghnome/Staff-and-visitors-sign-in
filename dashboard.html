<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>
body {
    margin:0;
    display:flex;
    height:100vh;
    font-family:Arial;
}

.btn-maroon {
    background: #660000;
    color: white;
}

.btn-maroon:hover {
    background: #4a0000;
}

/* LEFT IMAGE */
.left {
    width:50%;
    background:url("{{ url_for('static', filename='ESECjunior-playground.png') }}");
    background-size:cover;
}

/* RIGHT SIDE */
.right {
    width:50%;
    background:#c62828;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* LOGO */
.logo {
    position:absolute;
    top:15px;
    left:15px;
    width:80px;
}

/* CONTENT BOX */
.box {
    background:white;
    padding:30px;
    border-radius:10px;
    text-align:center;
}

/* 🔻 SIGNOUT FORM (NOW BOTTOM LEFT) */
.signout-container {
    position:fixed;
    bottom:20px;
    left:20px;
}

.signout-box {
    background:#e0e0e0;
    padding:20px;
    border-radius:10px;
    width:260px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.signout-box input {
    width:100%;
    padding:8px;
    margin:10px 0;
}

.signout-box button {
    width:100%;
    padding:10px;
    background:#c62828;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

/* 🔻 BUTTONS (NOW BOTTOM CENTER) */
.bottom-center {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
}

.bottom-center button {
    display:block;
    margin-top:10px;
    padding:12px 18px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

/* BUTTON COLORS */
.btn-grey {
    background:grey;
    color:white;
}

.btn-red {
    background:#c62828;
    color:white;
}

/* PRINT BUTTON (BOTTOM RIGHT) */
.print-btn {
    position:fixed;
    bottom:25px;
    right:25px;
    background:grey;
    color:white;
    padding:18px 28px;
    font-size:16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.print-btn:hover {
    background:#555;
}
</style>
</head>

<body>

<!-- LEFT -->
<div class="left"></div>

<!-- RIGHT -->
<div class="right">

<img src="{{ url_for('static', filename='logo.png') }}" class="logo">

<div class="box">
    <h2>Welcome to Errington</h2>
    <h2>{{ name }} 👋</h2>

    <p>Role: <strong>{{ role }}</strong></p>

    <p>Sign-in Date & Time:<br>
    <strong>{{ signin_time }}</strong></p>

    {% if role == 'admin' %}
        <a href="/report">View Report</a>
    {% endif %}
</div>



<!-- 🔻 BUTTONS (BOTTOM CENTER) -->
<div class="bottom-center">

    <a href="/get-started">
        <button class="btn-maroon">⬅ Go Back</button>
    </a>

    <a href="/returning">
        <button class="btn-maroon">➡ Next Visitor</button>
    </a>

    <a href="/signout">
        <button class="btn-maroon">➜ Sign Out</button>
    </a>

</div>
<!-- 🔻 PRINT BUTTON -->
{% if role.lower() in ['visitor', 'therapist', 'contractor', 'volunteer'] %}
<a href="/print-label">
    <button class="print-btn">🖨 Print Label</button>
</a>
{% endif %}

<!-- AUTO TIMEOUT -->
<script>
let timeout;

function resetTimer() {
    clearTimeout(timeout);
    timeout = setTimeout(function () {
        window.location.href = "/";
    }, 30000);
}

window.onload = resetTimer;
document.onmousemove = resetTimer;
document.onkeypress = resetTimer;
document.onclick = resetTimer;
document.ontouchstart = resetTimer;
</script>

</body>
</html>
