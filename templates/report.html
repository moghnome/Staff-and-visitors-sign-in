<!DOCTYPE html>
<html>
<head>
    <title>Report</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            padding: 20px;
            margin: 0;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .logo {
            width: 80px;
        }

        h2 {
            margin: 0;
        }

        /* 🔍 Search Bar */
        .search-box {
            margin: 15px 0;
        }

        .search-box input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        /* Export buttons */
        .export-buttons {
            margin: 15px 0;
        }

        .export-buttons a {
            text-decoration: none;
            margin-right: 10px;
        }

        .export-buttons button {
            padding: 8px 12px;
            background-color: #c62828;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background-color: #c62828;
            color: white;
        }

        .note-input {
            width: 90%;
            padding: 6px;
            border: 1px solid #bbb;
            border-radius: 4px;
        }

        .save-btn {
            margin-top: 5px;
            padding: 6px 10px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .save-btn:hover {
            background-color: #1b5e20;
        }

        .back-link {
            display: block;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- ✅ Header -->
<div class="header">
    <h2>Visitor Report</h2>
    <img src="{{ url_for('static', filename='logo.png') }}" class="logo">
</div>

<!-- 🔍 SEARCH BAR -->
<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search by name, mobile, role...">
</div>

<!-- ✅ Export Buttons -->
<div class="export-buttons">
    <a href="/export/csv">
        <button>⬇ Export CSV</button>
    </a>
</div>

<!-- ✅ Table -->
<table id="reportTable">
    <tr>
        <th>Name</th>
        <th>Mobile</th>
        <th>Role</th>
        <th>Sign In</th>
        <th>Sign Out</th>
        <th>NOTE</th>
    </tr>

    {% for row in data %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[4] if row[4] else "Still Signed In" }}</td>

        <!-- ✅ NOTE COLUMN -->
        <td>
            <form action="/save_note" method="POST">
                
                <!-- Hidden ID or mobile -->
                <input type="hidden" name="mobile" value="{{ row[1] }}">

                <!-- Note box -->
                <textarea 
                    name="note" 
                    class="note-input"
                    rows="2"
                    placeholder="Add comment here..."
                >{{ row[5] if row|length > 5 else "" }}</textarea>

                <br>

                <!-- Save button -->
                <button type="submit" class="save-btn">
                    Save
                </button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>

<a href="/dashboard" class="back-link">⬅ Back to Dashboard</a>

<!-- 🔍 SEARCH SCRIPT -->
<script>
document.getElementById("searchInput").addEventListener("keyup", function () {
    let filter = this.value.toLowerCase();
    let rows = document.querySelectorAll("#reportTable tr");

    rows.forEach((row, index) => {
        if (index === 0) return; // skip header

        let text = row.innerText.toLowerCase();

        if (text.includes(filter)) {
            row.style.display = "";
        } else {
            row.style.display = "none";
        }
    });
});
</script>

<!-- AUTO REDIRECT SCRIPT -->
<script>
    let timeout;

    function resetTimer() {
        clearTimeout(timeout);
        timeout = setTimeout(function () {
            window.location.href = "/";
        }, 30000);
    }

    function setupActivityTracking() {
        window.addEventListener("load", resetTimer);
        document.addEventListener("mousemove", resetTimer);
        document.addEventListener("keypress", resetTimer);
        document.addEventListener("click", resetTimer);
        document.addEventListener("touchstart", resetTimer);
    }

    setupActivityTracking();
</script>

</body>
</html>
